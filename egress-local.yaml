# LiveKit Egress Configuration - LOCAL DEVELOPMENT
# =================================================
# Use this config when:
# - LiveKit Server runs LOCALLY (livekit-server.exe)
# - Egress runs in Docker
# - Redis runs in Docker (exposed on host:6379)
# - MinIO runs in Docker (exposed on host:9002)
#
# IMPORTANT: Local LiveKit must use redis: localhost:6379
# Either use livekit-local.yaml OR modify livekit.yaml temporarily
#
# Usage (PowerShell):
#   docker run --rm `
#     -e EGRESS_CONFIG_FILE=/etc/egress.yaml `
#     -v ${PWD}/egress-local.yaml:/etc/egress.yaml:ro `
#     --add-host=host.docker.internal:host-gateway `
#     --network exam-cheating-detection-v2_default `
#     --cap-add SYS_ADMIN `
#     livekit/egress:latest

# API credentials (must match livekit.yaml / livekit-local.yaml)
api_key: devkey
api_secret: secret

# LiveKit server URL
# host.docker.internal allows Docker container to reach host machine
ws_url: ws://host.docker.internal:7880

# Health check server
health_port: 7881

# Logging
log_level: debug

# Redis configuration (Required for RPC between LiveKit and Egress)
# CRITICAL: Must connect to the SAME Redis that LiveKit uses!
# Since Redis is in Docker and exposed on host:6379, use host.docker.internal
redis:
  address: host.docker.internal:6379

# S3/MinIO configuration for storing recordings
# Using Docker network name since MinIO is in Docker
s3:
  access_key: minioadmin
  secret: minioadmin123
  # Use Docker network name if on same network, or host.docker.internal
  endpoint: http://host.docker.internal:9002
  bucket: exam-evidence
  region: us-east-1
  force_path_style: true

# Recording settings
room_composite:
  # Video settings
  video_bitrate: 3000000
  video_framerate: 30
  video_width: 1280
  video_height: 720
  video_codec: h264
  
  # Audio settings  
  audio_bitrate: 128000
  audio_frequency: 48000
  
  # Output format
  file_type: mp4

track_composite:
  video_bitrate: 1500000
  video_framerate: 24
  video_width: 1280
  video_height: 720
  video_codec: h264
  video_profile: main
  
  audio_bitrate: 96000
  audio_frequency: 44100
  
  file_type: mp4

# CPU/memory limits for encoding
cpu_cost:
  room_composite: 3.0
  track_composite: 2.0
  track: 1.0
