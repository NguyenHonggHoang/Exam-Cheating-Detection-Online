name: exam-cheating-detection-v2

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16.3
    container_name: exam-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: exam-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: exam-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  otel-collector:
    image: otel/opentelemetry-collector:0.88.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./services/auth-server/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"

  authorization-server:
    build:
      context: ./services/auth-server
      dockerfile: Dockerfile
    container_name: exam-auth-server
    environment:
      OAUTH_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      OAUTH_DB_USERNAME: postgres
      OAUTH_DB_PASSWORD: postgres
      AS_ISSUER_URI: http://localhost:9000
      AS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      BFF_CLIENT_ID: exam-bff-client
      BFF_CLIENT_SECRET: exam-bff-secret
      BFF_REDIRECT_URI: http://localhost:8080/api/auth/callback/exam-oidc
      SPA_CLIENT_ID: react-test-client
      SPA_REDIRECT_URI: http://localhost:5174/auth/callback
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_AUTHENTICATION: DEBUG
      SPRING_SECURITY_DEBUG: true
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: exam-user-service
    environment:
      UMS_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      UMS_DB_USERNAME: postgres
      UMS_DB_PASSWORD: postgres
      AS_ISSUER_URI: http://localhost:9000
      AS_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_started

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: exam-admin-service
    environment:
      OAUTH_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      OAUTH_DB_USERNAME: postgres
      OAUTH_DB_PASSWORD: postgres
      ADMIN_API_USERNAME: admin
      ADMIN_API_PASSWORD: admin-secret
      BFF_CLIENT_ID: exam-bff-client
      BFF_CLIENT_SECRET: exam-bff-secret
      BFF_REDIRECT_URI: http://localhost:8080/api/auth/callback/exam-oidc
      BFF_LOGOUT_REDIRECT: http://localhost:8080
      AS_ISSUER_URI: http://localhost:9000
      AS_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      APP_SERVICES_USER_SERVICE_URL: http://user-service:8100
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy

  bff-gateway:
    build:
      context: ./gateways/bff
      dockerfile: Dockerfile
    container_name: exam-bff
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:8080
      NEXTAUTH_SECRET: 8f4b2e9a1d3c5f6e7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f
      BFF_CLIENT_ID: exam-bff-client
      BFF_CLIENT_SECRET: exam-bff-secret
      AUTH_SERVER_ISSUER: http://localhost:9000
      AUTH_SERVER_TOKEN_URL: http://authorization-server:9000/oauth2/token
      AUTH_SERVER_USERINFO_URL: http://authorization-server:9000/userinfo
      AUTH_SERVER_URL: http://authorization-server:9000
      AUTH_SERVER_EXTERNAL_URL: http://localhost:9000
      UPSTREAM_API_BASE_URL: http://user-service:8100
      SESSION_SERVICE_URL: http://session-service:8081
      BFF_SCOPES: openid profile exam.read exam.write offline_access
      BFF_SESSION_COOKIE: SESSION_ID
      BFF_DB_HOST: postgres
      BFF_DB_PORT: 5432
      BFF_DB_NAME: bff_db
      BFF_DB_USER: postgres
      BFF_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      authorization-server:
        condition: service_started
      user-service:
        condition: service_started

  session-service:
    build:
      context: ./services/session-service
      dockerfile: Dockerfile
    container_name: exam-session-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/session_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_PROFILES_ACTIVE: dev
      SECURITY_REQUIRE_AUTH: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SPRING_TOKEN_URI: http://authorization-server:9000/oauth2/token
      SPRING_FLYWAY_BASELINE-ON-MIGRATE: "true"
      SPRING_FLYWAY_BASELINE-VERSION: "0"
      # Kafka CDC Configuration
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: session-service-cdc
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      # MinIO Configuration - use localhost:9002 for presigned URLs
      # extra_hosts allows container to resolve localhost to host machine
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: http://localhost:9002
      MINIO_BROWSER_ENDPOINT: http://localhost:9002
      # Public URL for AI worker to download images (uses internal Docker network)
      MINIO_PUBLIC_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      # LiveKit Configuration
      # When LiveKit runs locally: use host.docker.internal:7880
      # When LiveKit runs in Docker: use livekit:7880
      LIVEKIT_HOST: ws://host.docker.internal:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_started
      authorization-server:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "localhost:host-gateway"

  # --- Incident Service (NEW) ---
  incident-service:
    build:
      context: ./services/incident-service
      dockerfile: Dockerfile
    container_name: exam-incident-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/incident_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      authorization-server:
        condition: service_started

  # --- Kafka for CDC (Debezium) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: exam-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: exam-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data

  # --- Debezium Connect for CDC ---
  debezium:
    image: debezium/connect:2.4
    container_name: exam-debezium
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - postgres

  # --- MinIO Object Storage ---
  minio:
    image: minio/minio:latest
    container_name: exam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Python AI Worker (Face Verification with InsightFace) ---
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: exam-ai-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      # MinIO Configuration - accessible from Docker network
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: exam-identity
      # Face Verification Threshold (0.6 = balanced accuracy)
      FACE_VERIFICATION_THRESHOLD: 0.6
      USE_GPU: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # --- LiveKit WebRTC Server ---
  livekit:
    image: livekit/livekit-server:latest
    container_name: exam-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"       # WebSocket signaling
      - "7881:7881"       # TCP fallback for media
      - "7882:7882/udp"   # UDP media
      - "3478:3478/udp"   # TURN UDP
      - "50000-50020:50000-50020/udp"  # RTC UDP range (subset)
    volumes:
      - ./livekit-docker.yaml:/etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  # --- LiveKit Egress Service (Server-side Recording) ---
  livekit-egress:
    image: livekit/egress:latest
    container_name: exam-livekit-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_ADMIN
    depends_on:
      - minio
      - redis
    restart: unless-stopped

  # --- Nginx Gateway (Load Balancer + Rate Limiting) ---
  nginx:
    image: nginx:1.25-alpine
    container_name: exam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/rate-limit.conf:/etc/nginx/conf.d/rate-limit.conf:ro
    depends_on:
      - bff-gateway
      - session-service
      - incident-service
      - user-service
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  exam-ui:
    build:
      context: ./frontends/exam-ui
      dockerfile: Dockerfile
    container_name: exam-ui
    ports:
      - "5173:80" 
    depends_on:
      bff-gateway:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  uploads:
  zookeeper-data:
  kafka-data:
  minio-data:

