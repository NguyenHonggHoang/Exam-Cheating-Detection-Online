# ==========================================
# 1. Authorization Server (auth-server)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: authorization-server
  namespace: exam-platform
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: authorization-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-server
  namespace: exam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authorization-server
  template:
    metadata:
      labels:
        app: authorization-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "9000"
    spec:
      serviceAccountName: auth-server
      containers:
        - name: authorization-server
          image: exam-auth-server:latest # locally built
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192M -Xmx384M -XX:+UseG1GC"
            - name: OAUTH_DB_URL
              value: jdbc:postgresql://postgres:5432/identity_db?sslmode=disable
            - name: OAUTH_DB_USERNAME
              value: postgres
            - name: OAUTH_DB_PASSWORD
              value: postgres
            - name: AS_ISSUER_URI
              value: http://authorization-server:9000
            - name: AS_ALLOWED_ORIGINS
              value: http://localhost:5173,http://localhost:5174
            - name: BFF_CLIENT_ID
              value: exam-bff-client
            - name: BFF_CLIENT_SECRET
              value: exam-bff-secret
          ports:
            - containerPort: 9000
---
# ==========================================
# 2. User Service (user-service)
# ==========================================
apiVersion: v1
