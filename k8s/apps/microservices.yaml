# ==========================================
# 6. BFF Gateway (bff-gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: bff-gateway
  namespace: exam-platform
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: bff-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-gateway
  namespace: exam-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bff-gateway
  template:
    metadata:
      labels:
        app: bff-gateway
      annotations:
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{"accessLogFile": "/dev/null"}'
    spec:
      serviceAccountName: bff-gateway
      containers:
        - name: bff-gateway
          image: exam-bff:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
            - name: NODE_ENV
              value: production
            - name: NEXTAUTH_URL
              value: http://localhost:8080
            - name: NEXTAUTH_SECRET
              value: 8f4b2e9a1d3c5f6e7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f
            - name: BFF_CLIENT_ID
              value: exam-bff-client
            - name: BFF_CLIENT_SECRET
              value: exam-bff-secret
            - name: AUTH_SERVER_ISSUER
              value: http://authorization-server:9000
            - name: AUTH_SERVER_TOKEN_URL
              value: http://authorization-server:9000/oauth2/token
            - name: AUTH_SERVER_USERINFO_URL
              value: http://authorization-server:9000/userinfo
            - name: AUTH_SERVER_URL
              value: http://authorization-server:9000
            - name: AUTH_SERVER_EXTERNAL_URL
              value: http://localhost:9000
            - name: UPSTREAM_API_BASE_URL
              value: http://user-service:8100
            - name: SESSION_SERVICE_URL
              value: http://session-service:8081
            - name: BFF_SCOPES
              value: openid profile offline_access
            - name: BFF_SESSION_COOKIE
              value: SESSION_ID
            - name: BFF_DB_HOST
              value: postgres
            - name: BFF_DB_PORT
              value: "5432"
            - name: BFF_DB_NAME
              value: bff_db
            - name: BFF_DB_USER
              value: postgres
            - name: BFF_DB_PASSWORD
              value: postgres
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: INCIDENT_SERVICE_URL
              value: http://incident-service:8082
            - name: ADMIN_SERVICE_URL
              value: http://admin-service:8200
            - name: SECURE_COOKIE
              value: "false"
            - name: BFF_PROXY_CONNECT_TIMEOUT_MS
              value: "60000"
            - name: BFF_PROXY_HEADERS_TIMEOUT_MS
              value: "120000"
            - name: BFF_PROXY_BODY_TIMEOUT_MS
              value: "120000"
            - name: BFF_PROXY_CONNECTIONS
              value: "256"
          ports:
            - containerPort: 8080
---
# ==========================================
# 7. AI Worker (ai-worker)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: exam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      containers:
        - name: ai-worker
          image: exam-ai-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: guest
            - name: RABBITMQ_PASS
              value: guest
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: minioadmin123
            - name: MINIO_BUCKET
              value: exam-identity
            - name: FACE_VERIFICATION_THRESHOLD
              value: "0.6"
            - name: USE_GPU
              value: "false"
