      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8100"
    spec:
      serviceAccountName: user-service
      containers:
        - name: user-service
          image: exam-user-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128M -Xmx256M -XX:+UseG1GC"
            - name: UMS_DB_URL
              value: jdbc:postgresql://postgres:5432/identity_db?sslmode=disable
            - name: UMS_DB_USERNAME
              value: postgres
            - name: UMS_DB_PASSWORD
