# ==========================================
# 4. Session Service (session-service)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: exam-platform
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: session-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: exam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: session-service
      containers:
        - name: session-service
          image: exam-session-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256M -Xmx512M -XX:+UseG1GC"
            - name: SERVER_PORT
              value: "8081"
            - name: SERVER_TOMCAT_THREADS_MAX
              value: "400"
            - name: SERVER_TOMCAT_THREADS_MIN_SPARE
              value: "50"
            - name: SERVER_TOMCAT_ACCEPT_COUNT
              value: "1000"
            - name: SERVER_TOMCAT_MAX_CONNECTIONS
              value: "8192"
            - name: PRIMARY_DB_URL
              value: jdbc:postgresql://session-pgbouncer-primary-service:6432/session_db?sslmode=disable&reWriteBatchedInserts=true
            - name: PRIMARY_DB_USERNAME
              value: postgres
            - name: PRIMARY_DB_PASSWORD
              value: postgres
            - name: REPLICA_DB_URL
              value: jdbc:postgresql://session-pgbouncer-replica-service:6432/session_db?sslmode=disable&reWriteBatchedInserts=true
            - name: REPLICA_DB_USERNAME
              value: postgres
            - name: REPLICA_DB_PASSWORD
              value: postgres
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE
              value: "50"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS
              value: "true"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES
              value: "true"
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://authorization-server:9000/oauth2/jwks
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SPRING_TOKEN_URI
              value: http://authorization-server:9000/oauth2/token
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SPRING_ISSUER_URI
              value: http://authorization-server:9000
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_EXTERNAL_ENDPOINT
              value: http://localhost:9002
            - name: MINIO_ACCESS_KEY
              value: minioadmin
            - name: MINIO_SECRET_KEY
              value: minioadmin123
            - name: LIVEKIT_HOST
              value: ws://livekit:7880
            - name: LIVEKIT_API_KEY
              value: devkey
            - name: LIVEKIT_API_SECRET
              value: secret
            - name: GRPC_INCIDENT_SERVICE_ADDRESS
              value: static://incident-service:9091
          ports:
            - containerPort: 8081
---
