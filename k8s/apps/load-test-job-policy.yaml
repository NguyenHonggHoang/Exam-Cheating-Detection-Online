# =============================================================================
#  K8s Job: Policy-Enabled Full Stack Load Test
#  Run this with ALL security policies ACTIVE (Istio mTLS, Cilium, JWT)
#
#  Measured: True end-to-end performance WITH security overhead
#
#  Prerequisites:
#   1. Run migration to add ROPC grant:
#      kubectl exec -it deployment/auth-server -n exam-platform -- \
#        psql $DATABASE_URL -f /dev/stdin < \
#        services/auth-server/src/main/resources/migrations/add_ropc_grant_to_bff_client.sql
#   2. Restart auth-server: kubectl rollout restart deployment/auth-server -n exam-platform
#   3. Do NOT run disable-security-rules.ps1 — policies must be ACTIVE
#
#  Usage:
#    kubectl apply -f k8s/apps/load-test-job-policy.yaml
#    kubectl logs -f job/load-test-policy -n exam-platform
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: load-test-policy-script-config
  namespace: exam-platform
data:
  load_test_with_policy.py: |
    import asyncio, aiohttp, time, argparse, random, uuid, os, secrets, hashlib, base64, re
    from urllib.parse import urlparse, parse_qs, urlunparse
    from dataclasses import dataclass, field
    from typing import Optional, Tuple, Dict

    DEFAULT_EXAM_ID    = "e1000000-0000-0000-0000-000000000001"
    VIOLATION_TYPES    = ["TAB_SWITCH","LOOKING_AWAY","MULTIPLE_FACES","NO_FACE","PASTE","BLUR"]
    VIOLATION_STATES   = ["WARN","SUSPICIOUS","CRITICAL"]
    BFF_CLIENT_ID      = "exam-bff-client"
    BFF_CLIENT_SECRET  = "exam-bff-secret"
    TEST_PASSWORD      = "LoadTest@123!"

    @dataclass
    class EndpointStat:
        success: int = 0; failed: int = 0
        latencies: list = field(default_factory=list)
        errors: dict = field(default_factory=dict)
        def record(self, ms, status, ok):
            if ok: self.success+=1; self.latencies.append(ms)
            else:  self.failed+=1;  self.errors[str(status)]=self.errors.get(str(status),0)+1
        def report(self, total_sec):
            total=self.success+self.failed
            if total==0: return "  (no requests)"
            lines=[f"  Total    : {total}",
                   f"  Success  : {self.success/(total or 1)*100:.2f}%  (ok={self.success}, fail={self.failed})"]
            if self.latencies:
                s=sorted(self.latencies); n=len(s)
                avg=sum(s)/n; p50=s[int(n*0.50)]; p95=s[min(int(n*0.95),n-1)]; p99=s[min(int(n*0.99),n-1)]
                lines+=[f"  RPS      : {n/total_sec:.2f}",
                        f"  Avg/p50/p95/p99: {avg:.0f}/{p50:.0f}/{p95:.0f}/{p99:.0f} ms"]
            if self.errors:
                for code,cnt in sorted(self.errors.items()):
                    note=""
                    if code=="401": note=" ← JWT missing/invalid"
                    if code=="403": note=" ← Insufficient scope"
                    if code=="429": note=" ← Rate limited"
                    lines.append(f"  Error [{code}]{note}: {cnt}")
            return "\n".join(lines)

    _stats={}
    _fail_samples={}
    def stat(name):
        if name not in _stats: _stats[name]=EndpointStat()
        return _stats[name]

    async def req(session, method, url, sn, *, json_body=None, form_body=None,
                  headers=None, success_codes=(200,201,202,204), timeout=60):
        t0=time.time(); status=0; body=None
        try:
            kw=dict(timeout=aiohttp.ClientTimeout(total=timeout),headers=headers or {},allow_redirects=False)
            if json_body  is not None: kw["json"]=json_body
            if form_body  is not None: kw["data"]=form_body
            async with getattr(session,method.lower())(url,**kw) as r:
                status=r.status
                if status in success_codes:
                    try: body=await r.json(content_type=None)
                    except: body={}
                else:
                    text=(await r.text())[:300]
                    auth_hdr=r.headers.get("WWW-Authenticate","")
                    n=_fail_samples.get(sn,0)
                    if n < 3:
                        _fail_samples[sn]=n+1
                        print(f"DEBUG failure sample {sn}: status={status} www_auth={auth_hdr!r} body={text!r}")
        except asyncio.TimeoutError: status="Timeout"
        except Exception as e: status=type(e).__name__
        ms=(time.time()-t0)*1000; ok=isinstance(status,int) and status in success_codes
        stat(sn).record(ms,status,ok)
        return body if ok else None, status if isinstance(status,int) else 0

    async def policy_checks(session, bff, auth, token=None):
        print("\n  🔒  POLICY CHECKS (verifying security controls)...")
        passed=0; total=0
        async def chk(name, expected, method, url, **kwargs):
            nonlocal passed,total; total+=1; status=0
            try:
                kw=dict(timeout=aiohttp.ClientTimeout(total=10),allow_redirects=False)
                kw.update(kwargs)
                async with getattr(session,method.lower())(url,**kw) as r: status=r.status
            except: status=-1
            ok=status in expected
            if ok: passed+=1
            print(f"  {'✅' if ok else '❌'} [{status:3d}] {name}")

        await chk("No-token → 401",                        (401,),  "GET",  f"{bff}/api/proxy/mock-exam/{DEFAULT_EXAM_ID}/questions")
        await chk("Invalid Bearer → 401",                  (401,),  "POST", f"{bff}/api/proxy/mock-exam/start", headers={"Authorization":"Bearer invalid-token"}, json={"examId":DEFAULT_EXAM_ID})
        await chk("Wrong credentials → 400/401",           (400,401),"POST",f"{auth}/oauth2/token", data={"grant_type":"password","username":"nobody","password":"wrong","scope":"openid","client_id":BFF_CLIENT_ID,"client_secret":BFF_CLIENT_SECRET})
        uid_chk=uuid.uuid4().hex[:8]
        await chk("Public register (no auth needed) → 2xx",(200,201,409),"POST",f"{bff}/api/register",headers={"Content-Type":"application/json"},json={"username":f"pchk_{uid_chk}","password":TEST_PASSWORD,"email":f"pchk_{uid_chk}@t.internal","fullName":"PolicyCheck"})
        if token:
            await chk("Valid token → 200",                 (200,201),"GET", f"{bff}/api/proxy/mock-exam/{DEFAULT_EXAM_ID}/questions", headers={"Authorization":f"Bearer {token}"})
        print(f"  Result: {passed}/{total} checks passed")
        return passed, total

    async def phase_register(session, bff, n):
        print(f"\n[1/7] Registering {n} users via BFF...")
        async def reg(i):
            uid=str(uuid.uuid4()).replace("-","")[:12]; uname=f"lt_{uid}"
            await req(session,"POST",f"{bff}/api/register","POST {BFF}/api/register",
                      json_body={"username":uname,"password":TEST_PASSWORD,"email":f"{uname}@lt.internal","fullName":f"LT {i}"},
                      success_codes=(200,201,409))
            return {"username":uname,"password":TEST_PASSWORD}
        results=await asyncio.gather(*[reg(i) for i in range(n)],return_exceptions=True)
        users=[r for r in results if isinstance(r,dict)]
        s=stat("POST {BFF}/api/register"); print(f"  ✅ {s.success} new | {s.errors.get('409',0)} existing | {s.failed} failed")
        return users

    async def phase_login(session, auth, users):
        print(f"\n[2/7] Login {len(users)} users via OIDC Authorization Code Flow with PKCE...")
        token_url = f"{auth}/oauth2/token"

        authorize_url_template = (
            f"{auth}/oauth2/authorize?"
            f"response_type=code&"
            f"client_id={BFF_CLIENT_ID}&"
            f"scope=openid%20profile&"
            f"redirect_uri=http://localhost:8080/login/oauth2/code/exam-oidc&"
            f"code_challenge={{challenge}}&"
            f"code_challenge_method=S256&"
            f"state={{state}}"
        )

        def fix_url_if_auth(location: str, base_auth: str) -> str:
            parsed_loc = urlparse(location)
            parsed_base = urlparse(base_auth)
            if "/api/auth/callback" in parsed_loc.path or "/login/oauth2/code" in parsed_loc.path:
                return location
            if not parsed_loc.netloc or parsed_loc.hostname in [parsed_base.hostname, "localhost", "auth-server", "127.0.0.1", "authorization-server"]:
                return urlunparse((
                    parsed_base.scheme,
                    parsed_base.netloc,
                    parsed_loc.path,
                    parsed_loc.params,
                    parsed_loc.query,
                    parsed_loc.fragment
                ))
            return location

        login_semaphore = asyncio.Semaphore(20)

        async def login_one(user: dict) -> Optional[dict]:
            async with login_semaphore:
                return await login_one_inner(user)

        async def login_one_inner(user: dict) -> Optional[dict]:
            cookie_jar = aiohttp.CookieJar(unsafe=True)
            async with aiohttp.ClientSession(cookie_jar=cookie_jar) as u_sess:
                try:
                    # 1. Generate PKCE values
                    verifier = secrets.token_urlsafe(64)
                    sha256 = hashlib.sha256(verifier.encode('utf-8')).digest()
                    challenge = base64.urlsafe_b64encode(sha256).decode('utf-8').replace('=', '').replace('+', '-').replace('/', '_')
                    state = str(uuid.uuid4())

                    authorize_url = authorize_url_template.format(challenge=challenge, state=state)

                    # 2. Start authorization flow
                    async with u_sess.get(authorize_url, allow_redirects=False) as resp:
                        print(f"DEBUG {user['username']} - Step 2 Status: {resp.status}")
                        if resp.status == 302:
                            loc = resp.headers.get("Location", "")
                            login_page_url = fix_url_if_auth(loc, auth)
                            print(f"DEBUG {user['username']} - Login page: {login_page_url}")
                        else:
                            login_page_url = f"{auth}/login"

                    # 3. Fetch login page to retrieve the CSRF token
                    async with u_sess.get(login_page_url, allow_redirects=False) as resp:
                        print(f"DEBUG {user['username']} - Step 3 Status: {resp.status}")
                        html = await resp.text()

                    csrf_match = re.search(r'name="_csrf"\s+value="([^"]+)"', html)
                    if not csrf_match:
                        csrf_match = re.search(r'value="([^"]+)"\s+name="_csrf"', html)
                    csrf_token = csrf_match.group(1) if csrf_match else ""
                    print(f"DEBUG {user['username']} - CSRF: {csrf_token}")

                    # 4. Form login submit
                    login_data = {
                        "username": user["username"],
                        "password": user["password"],
                        "_csrf": csrf_token
                    }
                    post_login_url = f"{auth}/login"
                    async with u_sess.post(post_login_url, data=login_data, allow_redirects=False) as resp:
                        print(f"DEBUG {user['username']} - Step 4 Status: {resp.status}")
                        if resp.status == 302:
                            # Spring form-login may redirect to "/" after a successful login.
                            # Re-open the original authorization URL with the authenticated session
                            # to obtain the PKCE authorization code.
                            auth_consent_url = authorize_url
                            print(f"DEBUG {user['username']} - Auth consent redirect URL: {auth_consent_url}")
                        else:
                            auth_consent_url = authorize_url

                    # 5. Call authorization page again to trigger redirect to callback containing code
                    async with u_sess.get(auth_consent_url, allow_redirects=False) as resp:
                        print(f"DEBUG {user['username']} - Step 5 Status: {resp.status}")
                        if resp.status == 302:
                            location = resp.headers.get("Location", "")
                            print(f"DEBUG {user['username']} - Redirect callback Location: {location}")
                            parsed = urlparse(location)
                            qs = parse_qs(parsed.query)
                            code = qs.get("code", [None])[0]
                            print(f"DEBUG {user['username']} - Code: {code}")
                            if code:
                                # 6. Exchange authorization code for token
                                # NOTE: exam-bff-client uses client_secret_basic,
                                # credentials MUST be in HTTP Basic Auth header (not form body)
                                token_data = {
                                    "grant_type": "authorization_code",
                                    "code": code,
                                    "redirect_uri": "http://localhost:8080/login/oauth2/code/exam-oidc",
                                    "code_verifier": verifier,
                                }
                                basic_auth = aiohttp.BasicAuth(BFF_CLIENT_ID, BFF_CLIENT_SECRET)
                                async with u_sess.post(token_url, data=token_data, auth=basic_auth) as t_resp:
                                    print(f"DEBUG {user['username']} - Step 6 Token status: {t_resp.status}")
                                    if t_resp.status == 200:
                                        body = await t_resp.json()
                                        print(f"DEBUG {user['username']} - Access token: {bool(body.get('access_token'))}")
                                        if body and body.get("access_token"):
                                            stat("POST {AUTH}/oauth2/token [PKCE login]").record(0, 200, True)
                                            return {**user, "access_token": body["access_token"]}
                                    else:
                                        print(f"DEBUG {user['username']} - Token exchange fail payload: {await t_resp.text()}")
                        else:
                            print(f"DEBUG {user['username']} - Step 5 Location header: {resp.headers.get('Location')}")
                except Exception as e:
                    print(f"DEBUG: Exception in login_one: {type(e).__name__}: {str(e)}")

                stat("POST {AUTH}/oauth2/token [PKCE login]").record(0, 400, False)
                return None

        results = await asyncio.gather(*[login_one(u) for u in users], return_exceptions=True)
        authed  = [r for r in results if isinstance(r, dict) and r and r.get("access_token")]
        print(f"  ✅ {len(authed)}/{len(users)} users authenticated via OIDC PKCE Flow")
        return authed

    async def phase_verify(session, auth, users):
        print(f"\n[3/7] Verifying {len(users)} tokens via userinfo endpoint...")
        async def verify(user):
            body,_=await req(session,"GET",f"{auth}/userinfo","GET {AUTH}/userinfo [verify]",headers={"Authorization":f"Bearer {user['access_token']}"},success_codes=(200,))
            return {**user,"verified":bool(body)}
        results=await asyncio.gather(*[verify(u) for u in users],return_exceptions=True)
        ok=[r for r in results if isinstance(r,dict)]
        print(f"  ✅ {sum(1 for r in ok if r.get('verified'))}/{len(users)} tokens valid at userinfo")
        return ok or users

    async def phase_start(session, bff, users, exam_id):
        print(f"\n[4/7] Starting exam sessions via BFF...")
        async def start(user):
            body,_=await req(session,"POST",f"{bff}/api/proxy/mock-exam/start","POST {BFF}→session /mock-exam/start [JWT]",
                             json_body={"examId":exam_id,"userId":user["username"]},headers={"Authorization":f"Bearer {user['access_token']}"},success_codes=(200,201))
            if body:
                sid=body.get("sessionId") or body.get("id")
                if sid: return {**user,"session_id":sid}
            return None
        results=await asyncio.gather(*[start(u) for u in users],return_exceptions=True)
        started=[r for r in results if isinstance(r,dict)]
        print(f"  ✅ {len(started)}/{len(users)} sessions started via BFF (JWT validated)")
        return started

    async def phase_stress(session, bff, exam_id, users, dur):
        n=len(users); url=f"{bff}/api/proxy/mock-exam/{exam_id}/questions"
        sn="GET {BFF}→session /mock-exam/{id}/questions [STRESS+JWT]"
        print(f"\n[5/7] ⚡ STRESS: {n} users × 10 req/s via BFF with JWT ({dur}s)...")
        stop=asyncio.Event()
        async def worker(user):
            hdrs={"Authorization":f"Bearer {user['access_token']}"}
            while not stop.is_set():
                await req(session,"GET",url,sn,headers=hdrs); await asyncio.sleep(0.1)
        tasks=[]
        for i,u in enumerate(users):
            tasks.append(asyncio.create_task(worker(u)))
            if i%200==0 and i>0: await asyncio.sleep(0.01)
        await asyncio.sleep(dur); stop.set()
        await asyncio.gather(*tasks,return_exceptions=True)
        s=stat(sn); total=s.success+s.failed
        print(f"  ✅ {total} reqs | {s.success/(total or 1)*100:.1f}% ok | {s.success/dur:.1f} RPS | rate-limited: {s.errors.get('429',0)}")

    async def load_question_ids(session, bff, exam_id, user):
        body,_ = await req(session,"GET",f"{bff}/api/proxy/mock-exam/{exam_id}/questions","GET {BFF}->session /mock-exam/{id}/questions [load ids]",
                         headers={"Authorization":f"Bearer {user['access_token']}"})
        questions = body.get("questions", []) if isinstance(body, dict) else []
        q_ids = [q.get("id") for q in questions if isinstance(q, dict) and q.get("id")]
        if q_ids:
            print(f"  Loaded {len(q_ids)} question ids")
            return q_ids
        print("  No question ids returned; falling back to q1..q10")
        return [f"q{i+1}" for i in range(10)]

    async def phase_submit(session, bff, users, exam_id, q_ids):
        print(f"\n[6/7] Submitting exams via BFF...")
        async def submit(user):
            await req(session,"POST",f"{bff}/api/proxy/mock-exam/submit","POST {BFF}→session /mock-exam/submit [JWT]",
                      json_body={"sessionId":user["session_id"],"examId":exam_id,
                                 "answers":[{"questionId":qid,"answer":"Option 1","timeSpentMs":random.randint(10000,90000)} for qid in q_ids]},
                      headers={"Authorization":f"Bearer {user['access_token']}"})
        await asyncio.gather(*[submit(u) for u in users],return_exceptions=True)
        s=stat("POST {BFF}→session /mock-exam/submit [JWT]"); print(f"  ✅ {s.success}/{s.success+s.failed} submitted")

    async def phase_flood(session, bff, users, ipu):
        n=len(users); total=n*ipu; url=f"{bff}/api/proxy/incident/client-event"
        sn="POST {BFF}→incident /incident/client-event [FLOOD+JWT]"
        print(f"\n[7/7] ⚡ FLOOD: {n}×{ipu}={total} concurrent POSTs via BFF+JWT...")
        def payload(sid,idx):
            return {"sessionId":sid,"eventType":"SNAPSHOT_VIOLATION","violationType":random.choice(VIOLATION_TYPES),
                    "violationState":random.choice(VIOLATION_STATES),"evidenceUrl":f"http://minio:9000/{sid}/snap_{idx:03d}.jpg",
                    "objectKey":f"{sid}/snap_{idx:03d}.jpg","fileSize":random.randint(8000,40000),"timestamp":int(time.time()*1000)}
        tasks=[asyncio.create_task(req(session,"POST",url,sn,json_body=payload(u["session_id"],i),headers={"Authorization":f"Bearer {u['access_token']}"}))
               for u in users for i in range(ipu)]
        t0=time.time(); await asyncio.gather(*tasks,return_exceptions=True); elapsed=time.time()-t0
        s=stat(sn); done=s.success+s.failed
        print(f"  ✅ {done} reqs in {elapsed:.2f}s | {s.success/elapsed:.1f} RPS | {s.success/(done or 1)*100:.1f}% ok | rate-limited: {s.errors.get('429',0)}")

    def print_report(total_sec, policy_result=None):
        print("\n"+"="*72+"\n  📈  POLICY-ENABLED FULL STACK REPORT\n"+"="*72)
        print(f"  Wall-clock: {total_sec:.2f}s")
        if policy_result:
            p,t=policy_result; print(f"  Security checks: {p}/{t} passed\n")
        for name,s in _stats.items():
            if s.success+s.failed==0: continue
            print(f"  ┌─ {name}"); print(s.report(total_sec)); print()
        print("="*72)
        print("  p99>500ms → JWT validation overhead, check JWKS caching")
        print("  429 errors → Rate limiter ACTIVE (policy working)")
        print("  401 errors → Token expired during stress (add token refresh)")
        print("="*72)

    async def run(args):
        bff=args.bff.rstrip("/"); auth=args.auth.rstrip("/"); n=args.users
        print("="*72+"\n  🔐  POLICY-ENABLED FULL STACK LOAD TEST\n"+"="*72)
        print(f"  Users={n} | BFF={bff} | AUTH={auth}")
        connector=aiohttp.TCPConnector(limit=n*4+200,limit_per_host=0,ttl_dns_cache=600)
        t0=time.time(); pchk=None
        async with aiohttp.ClientSession(connector=connector) as http:
            if args.skip_register:
                users=[{"username":f"lt_{str(uuid.uuid4()).replace('-','')[:12]}","password":TEST_PASSWORD} for _ in range(n)]
                print(f"\n[1/7] Skipped. {n} synthetic users.")
            else:
                users=await phase_register(http,bff,n)
            if not users: print("❌ No users."); return
            authed=await phase_login(http,auth,users)
            if not authed: print("❌ No tokens — check PKCE authorization_code client config."); print_report(time.time()-t0); return
            if not args.skip_policy_checks:
                pchk=await policy_checks(http,bff,auth,authed[0]["access_token"])
            verified=await phase_verify(http,auth,authed)
            started=await phase_start(http,bff,verified,args.exam_id)
            if not started: print("❌ No sessions."); print_report(time.time()-t0,pchk); return
            q_ids=await load_question_ids(http,bff,args.exam_id,started[0])
            await phase_stress(http,bff,args.exam_id,started,args.questions_duration)
            await phase_submit(http,bff,started,args.exam_id,q_ids)
            await phase_flood(http,bff,started,args.incidents_per_user)
        print_report(time.time()-t0,pchk)

    def main():
        p=argparse.ArgumentParser()
        p.add_argument("--bff",  default=os.getenv("LT_BFF_URL","http://bff-gateway:8080"))
        p.add_argument("--auth", default=os.getenv("LT_AUTH_URL","http://auth-server:9000"))
        p.add_argument("--users",              type=int, default=int(os.getenv("LT_USERS","200")))
        p.add_argument("--exam-id",            default=os.getenv("LT_EXAM_ID",DEFAULT_EXAM_ID))
        p.add_argument("--questions-duration", type=int, default=int(os.getenv("LT_QUESTIONS_DURATION","20")))
        p.add_argument("--incidents-per-user", type=int, default=int(os.getenv("LT_INCIDENTS_PER_USER","20")))
        p.add_argument("--skip-register",       action="store_true", default=os.getenv("LT_SKIP_REGISTER","false").lower()=="true")
        p.add_argument("--skip-policy-checks",  action="store_true", default=os.getenv("LT_SKIP_POLICY_CHECKS","false").lower()=="true")
        asyncio.run(run(p.parse_args()))

    if __name__ == "__main__":
        main()

---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-policy
  namespace: exam-platform
  labels:
    app: load-test-policy
    type: performance-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900      # 15 min max (policy checks + slower with security)
  template:
    metadata:
      labels:
        app: load-test-policy
    spec:
      restartPolicy: Never
      # Use same service account as BFF so Istio mTLS principal is allowed by AuthorizationPolicy.
      serviceAccountName: bff-gateway
      containers:
        - name: test-runner
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              pip install --quiet aiohttp
              python /scripts/load_test_with_policy.py
              status=$?
              python - <<'PY'
              import urllib.request
              try:
                  urllib.request.urlopen(
                      urllib.request.Request("http://127.0.0.1:15020/quitquitquit", method="POST"),
                      timeout=2,
                  )
              except Exception:
                  pass
              PY
              exit $status
          env:
            # ── Entry points ──────────────────────────────────────────────────
            - name: LT_BFF_URL
              value: "http://istio-ingressgateway.istio-system.svc.cluster.local"
            - name: LT_AUTH_URL
              value: "http://authorization-server:9000"

            # ── Load parameters ───────────────────────────────────────────────
            # NOTE: policy overhead → use fewer users than non-policy test
            # Start with 100 and increase if the system handles it well
            - name: LT_USERS
              value: "200"
            - name: LT_EXAM_ID
              value: "e1000000-0000-0000-0000-000000000001"
            - name: LT_QUESTIONS_DURATION
              value: "20"
            - name: LT_INCIDENTS_PER_USER
              value: "20"
            - name: LT_SKIP_REGISTER
