# ==========================================
# 4. Cilium Network Policy for RabbitMQ
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: rabbitmq-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchLabels:
      app: rabbitmq
  ingress:
  # Allow session-service, incident-service, and ai-worker to connect to RabbitMQ (5672)
  - fromEndpoints:
    - matchLabels:
        app: session-service
    - matchLabels:
        app: incident-service
    - matchLabels:
        app: ai-worker
    toPorts:
    - ports:
      - port: "5672"
        protocol: TCP
---
# ==========================================
# 5. Cilium Network Policy for PgBouncer Pools
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: pgbouncer-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - incident-pgbouncer-primary
          - incident-pgbouncer-replica
          - session-pgbouncer-primary
          - session-pgbouncer-replica
  ingress:
  # Allow all application pods in the namespace to connect to PgBouncer pools (6432)
  - fromEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": exam-platform
    toPorts:
    - ports:
      - port: "6432"
        protocol: TCP
---
# ==========================================
# 6. Cilium Network Policy for Dedicated Databases
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: dedicated-db-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - incident-db-primary
          - incident-db-replica
          - session-db-primary
          - session-db-replica
  ingress:
  # Allow respective PgBouncers to connect to DB backend (5432)
  - fromEndpoints:
    - matchExpressions:
        - key: app
          operator: In
          values:
            - incident-pgbouncer-primary
            - incident-pgbouncer-replica
            - session-pgbouncer-primary
            - session-pgbouncer-replica
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  # Allow database clusters to communicate with each other for streaming replication
  - fromEndpoints:
    - matchExpressions:
        - key: app
          operator: In
          values:
            - incident-db-primary
            - incident-db-replica
            - session-db-primary
            - session-db-replica
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
---
