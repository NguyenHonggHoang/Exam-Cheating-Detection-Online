# ==========================================
# 1. Cilium Network Policy for user-service
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: user-service-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchLabels:
      app: user-service
  ingress:
  # Allow admin-service to call user-service HTTP (8100) and gRPC (9090)
  - fromEndpoints:
    - matchLabels:
        app: admin-service
    toPorts:
    - ports:
      - port: "8100"
        protocol: TCP
      - port: "9090"
        protocol: TCP
  # Allow authorization-server to reach user-service
  - fromEndpoints:
    - matchLabels:
        app: authorization-server
    toPorts:
    - ports:
      - port: "8100"
        protocol: TCP
  # Allow bff-gateway to call user-service HTTP (8100)
  - fromEndpoints:
    - matchLabels:
        app: bff-gateway
    toPorts:
    - ports:
      - port: "8100"
        protocol: TCP
---
# ==========================================
# 2. Cilium Network Policy for incident-service
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: incident-service-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchLabels:
      app: incident-service
  ingress:
  # Allow session-service to call incident-service gRPC (9091)
  - fromEndpoints:
    - matchLabels:
        app: session-service
    toPorts:
    - ports:
      - port: "9091"
        protocol: TCP
  # Allow bff-gateway to call incident-service HTTP (8082)
  - fromEndpoints:
    - matchLabels:
        app: bff-gateway
    toPorts:
    - ports:
      - port: "8082"
        protocol: TCP
  # Allow ai-worker to call incident-service HTTP (8082) & gRPC (9091)
  - fromEndpoints:
    - matchLabels:
        app: ai-worker
    toPorts:
    - ports:
      - port: "8082"
        protocol: TCP
      - port: "9091"
        protocol: TCP
---
# ==========================================
# 2.1. Cilium Network Policy for authorization-server
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: authorization-server-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchLabels:
      app: authorization-server
  ingress:
  # Allow core services and gateway to authenticate (9000)
  - fromEndpoints:
    - matchLabels:
        app: bff-gateway
    - matchLabels:
        app: session-service
    - matchLabels:
        app: incident-service
    - matchLabels:
        app: user-service
    - matchLabels:
        app: admin-service
    toPorts:
    - ports:
      - port: "9000"
        protocol: TCP
---
# ==========================================
# 2.2. Cilium Network Policy for session-service
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: session-service-policy
  namespace: exam-platform
spec:
