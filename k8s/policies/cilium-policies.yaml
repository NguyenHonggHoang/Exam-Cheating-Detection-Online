    matchLabels:
      app: session-service
  ingress:
  # Allow bff-gateway to call session-service HTTP (8081)
  - fromEndpoints:
    - matchLabels:
        app: bff-gateway
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
---
# ==========================================
# 2.3. Cilium Network Policy for admin-service
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: admin-service-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchLabels:
      app: admin-service
  ingress:
  # Allow bff-gateway to call admin-service HTTP (8200)
  - fromEndpoints:
    - matchLabels:
        app: bff-gateway
    toPorts:
    - ports:
      - port: "8200"
        protocol: TCP
---
# ==========================================
# 2.4. Cilium Network Policy for bff-gateway
# ==========================================
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: bff-gateway-policy
  namespace: exam-platform
spec:
  endpointSelector:
    matchLabels:
      app: bff-gateway
  ingress:
  # Allow ingress from Istio Ingress Gateway pods (typically in istio-system namespace)
  - fromEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": istio-system
        app: istio-ingressgateway
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # Allow internal testing access from local exam namespace
  - fromEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": exam-platform
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
---
