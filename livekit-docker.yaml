# LiveKit Server Config - DOCKER ONLY
# Use this when running LiveKit inside Docker Compose
#
# For local development, use livekit.yaml with redis: localhost:6379

port: 7880

rtc:
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: true
  stun_servers:
    - stun.l.google.com:19302
    - stun1.l.google.com:19302
  enable_loopback_candidate: true

# Docker network DNS
redis:
  address: redis:6379

keys:
  devkey: secret

logging:
  level: info
  pion_level: warn

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

turn:
  enabled: false

webhook:
  urls:
    - http://session-service:8081/api/egress/webhook
  api_key: devkey
