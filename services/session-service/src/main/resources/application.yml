server:
  port: 8081

security:
  require-auth: true

spring:
  application:
    name: session-service
  datasource:
    primary:
      jdbc-url: ${PRIMARY_DB_URL:jdbc:postgresql://localhost:6432/session_db?reWriteBatchedInserts=true}
      username: ${PRIMARY_DB_USERNAME:postgres}
      password: ${PRIMARY_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    replica:
      jdbc-url: ${REPLICA_DB_URL:jdbc:postgresql://localhost:6432/session_db?reWriteBatchedInserts=true}
      username: ${REPLICA_DB_USERNAME:postgres}
      password: ${REPLICA_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      # Force connection session timezone to UTC to avoid invalid aliases like "Asia/Saigon"
      data-source-properties:
        options: -c TimeZone=UTC
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          'time_zone': UTC
        order_inserts: true
        order_updates: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    repair-on-migrate: true
  # Kafka Configuration for CDC
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:session-service-cdc}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  # RabbitMQ Configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      client:
        registration:
          session-service-client:
            provider: spring
            client-id: session-service
            client-secret: session-secret
            authorization-grant-type: client_credentials
            scope: incident.write,exam.read
        provider:
          spring:
            token-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_SPRING_TOKEN_URI:http://localhost:9000/oauth2/token}
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:9090/oauth2/jwks}

# CORS (cho FE local) - Allow all localhost ports for dev
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177"

# MinIO Configuration (S3-compatible Object Storage)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # External endpoint for presigned URLs (accessible from browser via Docker port mapping)
  external-endpoint: ${MINIO_EXTERNAL_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket:
    evidence: ${MINIO_BUCKET_EVIDENCE:exam-evidence}
    identity: ${MINIO_BUCKET_IDENTITY:exam-identity}

# Redis Configuration
redis:
  host: ${SPRING_REDIS_HOST:localhost}
  port: ${SPRING_REDIS_PORT:6379}

# LiveKit Configuration
livekit:
  host: ${LIVEKIT_HOST:ws://localhost:7880}
  public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}

grpc:
  client:
    incident-service:
      address: ${GRPC_INCIDENT_SERVICE_ADDRESS:static://localhost:9091}
      negotiationType: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo-service:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0



