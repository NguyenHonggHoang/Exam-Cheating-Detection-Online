spring:
  application:
    name: incident-service
  
  datasource:
    primary:
      jdbc-url: ${PRIMARY_DB_URL:jdbc:postgresql://localhost:6432/incident_db}
      username: ${PRIMARY_DB_USERNAME:postgres}
      password: ${PRIMARY_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    replica:
      jdbc-url: ${REPLICA_DB_URL:jdbc:postgresql://localhost:6432/incident_db}
      username: ${REPLICA_DB_USERNAME:postgres}
      password: ${REPLICA_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      data-source-properties:
        options: -c TimeZone=UTC
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50       # flush saveAll() as single batch INSERT (50 rows per statement)
          batch_versioned_data: true
        order_inserts: true    # group inserts by entity type for maximum batching efficiency
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    out-of-order: true
  
  # OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${OAUTH_JWK_SET_URI:http://auth-server:9000/oauth2/jwks}
  
  # Kafka Configuration (for Debezium CDC)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: incident-service-cdc
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  
  # RabbitMQ Configuration (for AI Workers)
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:exam}
    password: ${SPRING_RABBITMQ_PASSWORD:exam123}

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket:
    evidence: ${MINIO_BUCKET_EVIDENCE:exam-evidence}

server:
  port: 8082
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 8192

logging:
  level:
    com.example.exam: INFO
    org.springframework.kafka: INFO
    org.springframework.amqp: INFO

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo-service:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0
