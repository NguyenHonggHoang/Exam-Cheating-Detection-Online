# LiveKit Egress Configuration
# Server-side recording for proctoring evidence

# API credentials (must match livekit.yaml)
api_key: devkey
api_secret: secret

# LiveKit server URL (running on host machine)
ws_url: ws://host.docker.internal:7880

# Health check server
health_port: 7881

# Logging
# Logging
log_level: info

# Redis configuration (Required for RPC)
redis:
  address: redis:6379

# S3/MinIO configuration for storing recordings
s3:
  access_key: minioadmin
  secret: minioadmin123
  endpoint: http://minio:9000
  bucket: exam-evidence
  region: us-east-1
  force_path_style: true

# Recording settings
room_composite:
  # Video settings
  video_bitrate: 3000000
  video_framerate: 30
  video_width: 1280
  video_height: 720
  video_codec: h264
  
  # Audio settings  
  audio_bitrate: 128000
  audio_frequency: 48000
  
  # Output format
  file_type: mp4

track_composite:
  video_bitrate: 1500000
  video_framerate: 24
  video_width: 1280
  video_height: 720
  video_codec: h264
  video_profile: main
  
  audio_bitrate: 96000
  audio_frequency: 44100
  
  file_type: mp4

# CPU/memory limits for encoding
cpu_cost:
  room_composite: 3.0
  track_composite: 2.0
  track: 1.0
