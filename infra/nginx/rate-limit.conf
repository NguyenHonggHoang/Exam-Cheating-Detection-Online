# ============================================
# Rate Limiting Configuration
# ============================================
# Defines rate limiting zones for different API endpoints

# Zone: Authentication (strict)
# 5 requests/second per IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

# Zone: General API
# 20 requests/second per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Zone: Ingest/Streaming (high throughput)
# 100 requests/second per IP
limit_req_zone $binary_remote_addr zone=ingest:10m rate=100r/s;

# Zone: File Upload (restrictive)
# 2 requests/second per IP
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

# Zone: Static Assets (lenient)
# 50 requests/second per IP
limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

# Connection Limiting
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn conn_per_ip 50;

# Zone: WebSocket connections
# 10 connections per IP for real-time features
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
