# ============================================
# Nginx Gateway Configuration
# Exam Cheating Detection System
# ============================================
# Features: Load Balancing, Rate Limiting, CORS

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Rate Limiting Zones
    include /etc/nginx/conf.d/rate-limit.conf;

    # Upstream Definitions
    upstream bff_gateway {
        least_conn;
        server bff-gateway:8080 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream session_service {
        least_conn;
        server session-service:8081 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream incident_service {
        least_conn;
        server incident-service:8082 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream user_service {
        least_conn;
        server user-service:8100 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream auth_server {
        least_conn;
        server authorization-server:9000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # Main Server Block
    server {
        listen 80;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS Headers (for API routes)
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost:(3000|5173|5174)|exam\.example\.com)$") {
            set $cors_origin $http_origin;
        }

        # Health Check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Static Assets (Frontend) - High limit
        location /assets {
            limit_req zone=static burst=50 nodelay;
            proxy_pass http://bff_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1d;
        }

        # Auth Endpoints - Strict rate limiting
        location /auth {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://auth_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth2 Endpoints
        location /oauth2 {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://auth_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Session API - Real-time, moderate rate limiting
        location /api/sessions {
            limit_req zone=api burst=20 nodelay;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://session_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Incident API - Lower rate for reviews
        location /api/incidents {
            limit_req zone=api burst=15 nodelay;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://incident_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # User API
        location /api/users {
            limit_req zone=api burst=15 nodelay;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Ingest Endpoint - Higher rate for streaming data
        location /api/ingest {
            limit_req zone=ingest burst=50 nodelay;

            proxy_pass http://session_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            client_max_body_size 10M;
        }

        # Evidence Upload - Large files, lower rate
        location /api/storage {
            limit_req zone=upload burst=5 nodelay;

            proxy_pass http://session_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            client_max_body_size 50M;
        }

        # BFF Gateway - Default route for authentication flows
        location /api {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://bff_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Frontend SPA - Default
        location / {
            limit_req zone=static burst=30 nodelay;

            proxy_pass http://bff_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Error Pages
        error_page 429 @rate_limit;
        location @rate_limit {
            default_type application/json;
            return 429 '{"error": "too_many_requests", "message": "Rate limit exceeded. Please slow down."}';
        }

        error_page 502 503 504 @service_unavailable;
        location @service_unavailable {
            default_type application/json;
            return 503 '{"error": "service_unavailable", "message": "Service temporarily unavailable. Please try again later."}';
        }
    }
}
